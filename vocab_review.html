<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四下英语 · 暑假词汇通关</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system,"PingFang SC","Noto Sans SC",sans-serif; background: linear-gradient(160deg,#eef2ff 0%,#f5f3ff 45%,#fdf4ff 100%); min-height: 100vh; padding: 14px; padding-bottom: 40px; color:#1a1a2e; }

.header { background: linear-gradient(135deg,#4f46e5,#9333ea); border-radius: 18px; padding: 20px 18px; color: white; margin-bottom: 13px; }
.header-label { font-size: 0.62rem; opacity: .8; letter-spacing: 1px; margin-bottom: 4px; }
.header-title { font-size: 1.15rem; font-weight: 800; margin-bottom: 3px; }
.header-sub { font-size: 0.72rem; opacity: .85; line-height:1.5; }
.header-stats { display:flex; gap:8px; margin-top:12px; }
.hs-item { background: rgba(255,255,255,.18); border-radius: 10px; padding: 7px 6px; text-align:center; flex:1; }
.hs-num { font-size:1.05rem; font-weight:900; line-height:1; }
.hs-label { font-size:0.56rem; opacity:.85; margin-top:2px; }

.tip-banner { background: #fffbeb; border: 1px solid #fde68a; border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; font-size: 0.74rem; color: #92400e; line-height: 1.6; }

.card { background: white; border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
.voice-bar { display: flex; align-items: center; gap: 8px; }
.voice-name { font-size: 0.75rem; font-weight: 700; color: #1a1a2e; flex: 1; }
.rate-btns { display: flex; gap: 5px; }
.rate-btn { padding: 4px 9px; border-radius: 8px; border: 1.5px solid #e2e8f0; background: white; color: #94a3b8; font-size: 0.65rem; cursor: pointer; font-family: inherit; }
.rate-btn.active { border-color: #6d28d9; background: #f5f3ff; color: #6d28d9; font-weight: 700; }
.voice-toggle { padding: 5px 10px; background: #f1f5f9; border: none; border-radius: 8px; cursor: pointer; font-size: 0.68rem; color: #475569; font-weight: 600; font-family: inherit; }
.voice-list { display: none; flex-direction: column; gap: 5px; margin-top: 10px; max-height: 200px; overflow-y: auto; }
.voice-list.open { display: flex; }
.voice-item { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 9px; border: 1.5px solid #e2e8f0; background: #fafafa; cursor: pointer; }
.voice-item.selected { border-color: #6d28d9; background: #f5f3ff; }
.voice-dot { width: 7px; height: 7px; border-radius: 50%; background: #cbd5e1; flex-shrink: 0; }
.voice-item.selected .voice-dot { background: #6d28d9; }
.voice-item-name { font-size: 0.76rem; color: #334155; flex: 1; }
.voice-item.selected .voice-item-name { font-weight: 700; color: #4c1d95; }
.voice-item-lang { font-size: 0.62rem; color: #94a3b8; }

/* control switches */
.ctrl-row { display:flex; gap:8px; }
.switch-card { flex:1; background:white; border-radius:14px; padding:11px 12px; box-shadow:0 2px 12px rgba(0,0,0,.06); display:flex; align-items:center; justify-content:space-between; gap:8px; }
.switch-label { font-size:0.72rem; font-weight:700; color:#334155; line-height:1.3; }
.switch-sub { font-size:0.6rem; color:#94a3b8; margin-top:1px; }
.toggle { width:38px; height:22px; border-radius:12px; background:#e2e8f0; position:relative; cursor:pointer; flex-shrink:0; transition:.2s; }
.toggle.on { background:#7c3aed; }
.toggle::after { content:''; position:absolute; width:18px; height:18px; border-radius:50%; background:white; top:2px; left:2px; transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.3); }
.toggle.on::after { left:18px; }

.group { background: white; border-radius: 16px; margin-bottom: 12px; overflow: hidden; box-shadow: 0 3px 16px rgba(0,0,0,.07); }
.gh { padding: 12px 16px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
.gh.indigo { background:#eef2ff; border-bottom:1px solid #c7d2fe; }
.gh.orange { background: #fff7ed; border-bottom: 1px solid #fed7aa; }
.gh.blue   { background: #eff6ff; border-bottom: 1px solid #bfdbfe; }
.gh.green  { background: #f0fdf4; border-bottom: 1px solid #bbf7d0; }
.gh.rose   { background: #fff1f2; border-bottom: 1px solid #fecdd3; }
.gh.teal   { background: #f0fdfa; border-bottom: 1px solid #99f6e4; }
.gh.amber  { background: #fffbeb; border-bottom: 1px solid #fde68a; }
.gl { font-size: 0.85rem; font-weight: 700; }
.gl.indigo{ color:#4f46e5; }
.gl.orange { color: #ea580c; }
.gl.blue   { color: #2563eb; }
.gl.green  { color: #059669; }
.gl.rose   { color: #e11d48; }
.gl.teal   { color: #0d9488; }
.gl.amber  { color: #b45309; }
.gc { font-size: 0.63rem; color: #94a3b8; margin-top: 1px; }
.garr { font-size: 0.75rem; color: #94a3b8; }
.gb { padding: 10px 13px; }
.gb.hidden { display: none; }

.word-row { padding: 11px 4px; border-bottom: 1px solid #f1f5f9; }
.word-row:last-child { border-bottom: none; }
.word-row.hide-in-filter { display:none; }
.wr-top { display:flex; align-items:center; gap:8px; }
.wr-star { font-size:0.7rem; color:#f59e0b; flex-shrink:0; width:14px; }
.wr-en { font-size: 0.92rem; font-weight: 700; color:#1e293b; }
.wr-ph { font-size: 0.68rem; color:#94a3b8; margin-left:6px; }
.wr-cn { font-size: 0.78rem; color:#475569; margin-left:auto; text-align:right; }
.wr-page { font-size:0.58rem; color:#cbd5e1; margin-left:6px; flex-shrink:0; }
.wr-detail { margin-top:6px; padding-left:22px; }
.wr-phrase-row { display:flex; align-items:center; gap:6px; margin-bottom:5px; }
.wr-phrase { font-size:0.72rem; color:#7c3aed; background:#f5f3ff; display:inline-block; padding:2px 8px; border-radius:6px; font-weight:600; }
.wr-phrase span { color:#94a3b8; font-weight:400; margin-left:4px; }
.wr-sent { display:flex; align-items:flex-start; gap:6px; background:#f8fafc; border-radius:8px; padding:7px 9px; border-left:3px solid #c4b5fd; }
.wr-sent-txt { flex:1; }
.wr-sent-en { font-size:0.76rem; color:#334155; line-height:1.5; }
.wr-sent-cn { font-size:0.7rem; color:#94a3b8; margin-top:2px; }

/* self-test mode: blur/hide word, phrase & sentence until tapped */
.selftest .wr-en, .selftest .wr-cn, .selftest .wr-phrase, .selftest .wr-sent-en, .selftest .wr-sent-cn { filter: blur(5px); user-select:none; transition:filter .15s; cursor:pointer; }
.selftest .word-row.revealed .wr-en, .selftest .word-row.revealed .wr-cn, .selftest .word-row.revealed .wr-phrase, .selftest .word-row.revealed .wr-sent-en, .selftest .word-row.revealed .wr-sent-cn { filter:none; }
.selftest .wr-top::after { content:'点击显示全部'; font-size:0.58rem; color:#a78bfa; flex-shrink:0; margin-left:4px; }
.selftest .word-row.revealed .wr-top::after { content:''; }

.speak-btn { width: 26px; height: 26px; border-radius: 50%; border: none; cursor: pointer; font-size: 0.8rem; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all .15s; background:#f5f3ff; color:#7c3aed; }
.speak-btn.playing { background:#7c3aed; color:white !important; }
.speak-btn.sm { width:22px; height:22px; font-size:0.7rem; }

/* scenario dialogue/passage */
.scenario-box { background:#fdfcff; border:1px solid #ede9fe; border-radius:12px; padding:11px 12px; margin-bottom:12px; }
.scenario-hd { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.scenario-title { font-size:0.78rem; font-weight:700; color:#6d28d9; display:flex; align-items:center; gap:5px; }
.scenario-playall { padding:5px 11px; background:#7c3aed; color:white; border:none; border-radius:16px; font-size:0.66rem; font-weight:700; cursor:pointer; font-family:inherit; flex-shrink:0; }
.scenario-playall.playing { background:#4c1d95; }
.sc-line { display:flex; align-items:flex-start; gap:7px; padding:6px 0; border-bottom:1px dashed #ede9fe; }
.sc-line:last-child { border-bottom:none; }
.sc-who { width:38px; flex-shrink:0; font-size:0.62rem; font-weight:800; color:white; background:#a78bfa; border-radius:6px; text-align:center; padding:3px 0; margin-top:1px; }
.sc-who.b { background:#60a5fa; }
.sc-txt { flex:1; min-width:0; }
.sc-en { font-size:0.78rem; color:#1e293b; line-height:1.5; }
.sc-en b { color:#7c3aed; }
.sc-zh { font-size:0.68rem; color:#94a3b8; margin-top:2px; }
.sc-line.active { background:#f5f3ff; border-radius:8px; }

/* numbers grid */
.num-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:6px; }
.num-item { display:flex; align-items:center; gap:6px; background:#f8fafc; border-radius:9px; padding:7px 9px; }
.num-val { font-size:0.7rem; font-weight:800; color:#7c3aed; width:22px; flex-shrink:0; }
.num-en { font-size:0.78rem; font-weight:600; color:#1e293b; }
.num-cn { font-size:0.68rem; color:#94a3b8; margin-left:auto; }

/* quiz */
.mc-card { background:#fafafe; border-radius:12px; padding:11px 12px; margin-bottom:10px; border:1px solid #ede9fe; }
.mc-q { font-size:0.8rem; font-weight:700; color:#1e293b; margin-bottom:8px; }
.mc-q .qn { color:#7c3aed; margin-right:4px; }
.mc-opts { display:flex; flex-direction:column; gap:6px; }
.mc-opt { text-align:left; padding:8px 10px; border-radius:9px; border:1.5px solid #e2e8f0; background:white; font-size:0.76rem; color:#334155; cursor:pointer; font-family:inherit; }
.mc-opt:active { transform:scale(.98); }
.mc-opt.correct { background:#dcfce7; border-color:#86efac; color:#15803d; font-weight:700; }
.mc-opt.wrong { background:#fee2e2; border-color:#fca5a5; color:#dc2626; font-weight:700; }
.mc-opt.disabled { pointer-events:none; }
.quiz-score { text-align:center; padding:14px; font-size:0.85rem; font-weight:700; color:#7c3aed; }
.quiz-reset { display:block; margin:10px auto 0; padding:8px 18px; background:#7c3aed; color:white; border:none; border-radius:20px; font-size:0.75rem; font-weight:700; cursor:pointer; font-family:inherit; }

.footer { text-align: center; font-size: 0.72rem; color: #94a3b8; padding-top: 4px; }
::-webkit-scrollbar { width: 3px; }
</style>
</head>
<body>

<div class="header">
  <div class="header-label">四年级下册 · 暑假作业必做</div>
  <div class="header-title">📖 词汇通关 · Unit 1-6 + Numbers</div>
  <div class="header-sub">课本 P80-82 单元词汇表 · 逐词朗读 + 词组搭配 + 场景例句</div>
  <div class="header-stats">
    <div class="hs-item"><div class="hs-num" id="statTotal">-</div><div class="hs-label">总词数</div></div>
    <div class="hs-item"><div class="hs-num" id="statStar">-</div><div class="hs-label">★四会词</div></div>
    <div class="hs-item"><div class="hs-num">6+1</div><div class="hs-label">单元数</div></div>
  </div>
</div>

<div class="tip-banner">
  💡 加<b>★</b>的是《课标》二级词，要求<b>会读、会用、会默写</b>；没加★的词只要求认读理解。每个词配了一个常用<b>词组</b>和一句<b>场景例句</b>（例句由本页编写，帮助理解用法，不代表课本原文）。
</div>

<div class="card">
  <div class="voice-bar">
    <div><div class="voice-name" id="voiceName">🎙️ 加载声音中…</div></div>
    <div class="rate-btns">
      <button class="rate-btn" onclick="setRate(0.7,this)">慢</button>
      <button class="rate-btn active" onclick="setRate(0.85,this)">正常</button>
      <button class="rate-btn" onclick="setRate(1.1,this)">快</button>
    </div>
    <button class="voice-toggle" onclick="toggleVoiceList()">换声音</button>
  </div>
  <div class="voice-list" id="voiceList"></div>
</div>

<div class="ctrl-row">
  <div class="switch-card">
    <div><div class="switch-label">★ 只看重点词</div><div class="switch-sub">筛选四会词复习</div></div>
    <div class="toggle" id="starToggle" onclick="toggleStarFilter()"></div>
  </div>
  <div class="switch-card">
    <div><div class="switch-label">默写自测</div><div class="switch-sub">点击才显示答案</div></div>
    <div class="toggle" id="testToggle" onclick="toggleSelfTest()"></div>
  </div>
</div>

<div id="groupsRoot"></div>

<div class="group" id="gQuiz">
  <div class="gh amber" onclick="tog('gQuiz')">
    <div><div class="gl amber">📝 小测验 · 重点词自测</div><div class="gc" id="quizCount">共 0 题</div></div>
    <div class="garr" id="a_gQuiz">▼</div>
  </div>
  <div class="gb" id="b_gQuiz">
    <div id="quizRoot"></div>
    <div class="quiz-score" id="quizScore"></div>
    <button class="quiz-reset" onclick="resetQuiz()">重新测试</button>
  </div>
</div>

<div class="footer">四下英语 · 暑假词汇通关 · 点🔊听发音</div>

let currentVoice=null, currentRate=0.85, playingBtn=null, allVoices=[];
let starFilterOn=false, selfTestOn=false;

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }
function stripTags(s){ return (s||'').replace(/<[^>]+>/g,''); }

function tog(id){
  const b=document.getElementById('b_'+id);
  const a=document.getElementById('a_'+id);
  b.classList.toggle('hidden');
  a.textContent=b.classList.contains('hidden')?'▶':'▼';
}

function buildGroups(){
  const root=document.getElementById('groupsRoot');
  let html='';
  let totalWords=0, totalStar=0;
  UNITS.forEach((u,ui)=>{
    totalWords += u.words.length;
    totalStar += u.words.filter(w=>w.star).length;
    const rows = u.words.map(w=>{
      const starMark = w.star ? '<span class="wr-star">★</span>' : '<span class="wr-star"></span>';
      return `<div class="word-row" data-star="${w.star?1:0}" onclick="revealRow(this,event)">
        <div class="wr-top">
          ${starMark}
          <span class="wr-en">${esc(w.w)}</span>
          <span class="wr-ph">${esc(w.p)}</span>
          <button class="speak-btn sm" data-text="${esc(w.w)}" onclick="event.stopPropagation();speakIt(this)">🔊</button>
          <span class="wr-cn">${esc(w.c)}</span>
          <span class="wr-page">${esc(w.pg)}</span>
        </div>
        <div class="wr-detail">
          <div class="wr-phrase-row">
            <div class="wr-phrase">${esc(w.ph)}<span>${esc(w.phz)}</span></div>
            <button class="speak-btn sm" data-text="${esc(w.ph)}" onclick="event.stopPropagation();speakIt(this)">🔊</button>
          </div>
          <div class="wr-sent">
            <div class="wr-sent-txt">
              <div class="wr-sent-en">${esc(w.se)}</div>
              <div class="wr-sent-cn">${esc(w.sez)}</div>
            </div>
            <button class="speak-btn sm" data-text="${esc(w.se)}" onclick="event.stopPropagation();speakIt(this)">🔊</button>
          </div>
        </div>
      </div>`;
    }).join('');
    const scen = SCENARIOS[u.id];
    let scenHtml = '';
    if(scen){
      const lineHtml = scen.lines.map((l,li)=>`
        <div class="sc-line" id="scl_${u.id}_${li}">
          ${l.who?`<div class="sc-who ${li%2===1?'b':''}">${esc(l.who)}</div>`:''}
          <div class="sc-txt">
            <div class="sc-en">${l.en}</div>
            <div class="sc-zh">${esc(l.zh)}</div>
          </div>
          <button class="speak-btn sm" data-text="${esc(stripTags(l.en))}" onclick="speakIt(this)">🔊</button>
        </div>`).join('');
      scenHtml = `<div class="scenario-box">
        <div class="scenario-hd">
          <div class="scenario-title">🎬 ${esc(scen.title)}</div>
          <button class="scenario-playall" id="pa_${u.id}" onclick="playAllScenario('${u.id}')">▶ 整段播放</button>
        </div>
        ${lineHtml}
      </div>`;
    }
    html += `<div class="group" id="g_${u.id}">
      <div class="gh ${u.color}" onclick="tog('${u.id}')">
        <div><div class="gl ${u.color}">${esc(u.title)}</div><div class="gc">${esc(u.sub)} · 共${u.words.length}词</div></div>
        <div class="garr" id="a_${u.id}">${ui===0?'▼':'▶'}</div>
      </div>
      <div class="gb ${ui===0?'':'hidden'}" id="b_${u.id}">${scenHtml}${rows}</div>
    </div>`;
  });
  // numbers group
  const numRows = NUMBERS.items.map((n,i)=>`<div class="num-item">
      <div class="num-val">${i+1}</div>
      <button class="speak-btn sm" data-text="${esc(n[0])}" onclick="speakIt(this)">🔊</button>
      <div class="num-en">${esc(n[0])} <span style="color:#94a3b8;font-weight:400;">${esc(n[1])}</span></div>
      <div class="num-cn">${esc(n[2])}</div>
    </div>`).join('');
  html += `<div class="group" id="g_num">
      <div class="gh amber" onclick="tog('num')">
        <div><div class="gl amber">🔢 ${esc(NUMBERS.title)}</div><div class="gc">${esc(NUMBERS.sub)}</div></div>
        <div class="garr" id="a_num">▶</div>
      </div>
      <div class="gb hidden" id="b_num"><div class="num-grid">${numRows}</div></div>
    </div>`;
  root.innerHTML=html;
  document.getElementById('statTotal').textContent=totalWords;
  document.getElementById('statStar').textContent=totalStar;
}

function revealRow(el){
  if(!selfTestOn) return;
  el.classList.toggle('revealed');
}

function toggleStarFilter(){
  starFilterOn=!starFilterOn;
  document.getElementById('starToggle').classList.toggle('on',starFilterOn);
  document.querySelectorAll('.word-row').forEach(r=>{
    if(starFilterOn && r.getAttribute('data-star')==='0'){ r.classList.add('hide-in-filter'); }
    else { r.classList.remove('hide-in-filter'); }
  });
}

function toggleSelfTest(){
  selfTestOn=!selfTestOn;
  document.getElementById('testToggle').classList.toggle('on',selfTestOn);
  document.body.classList.toggle('selftest',selfTestOn);
  document.querySelectorAll('.word-row.revealed').forEach(r=>r.classList.remove('revealed'));
}

function speakIt(btn){
  const text=btn.getAttribute('data-text');
  if(!text||!window.speechSynthesis)return;
  if(playingBtn===btn){window.speechSynthesis.cancel();btn.classList.remove('playing');btn.textContent='🔊';playingBtn=null;return;}
  if(playingBtn){window.speechSynthesis.cancel();playingBtn.classList.remove('playing');playingBtn.textContent='🔊';}
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US';u.rate=currentRate;u.pitch=1.05;
  if(currentVoice)u.voice=currentVoice;
  u.onstart=()=>{btn.classList.add('playing');btn.textContent='⏹';playingBtn=btn;};
  u.onend=u.onerror=()=>{btn.classList.remove('playing');btn.textContent='🔊';if(playingBtn===btn)playingBtn=null;};
  window.speechSynthesis.speak(u);
}
let scenarioPlaying=null;
function playAllScenario(uid){
  const btn=document.getElementById('pa_'+uid);
  if(scenarioPlaying===uid){ window.speechSynthesis.cancel(); resetScenarioBtn(uid); return; }
  if(scenarioPlaying){ window.speechSynthesis.cancel(); resetScenarioBtn(scenarioPlaying); }
  const scen=SCENARIOS[uid];
  scenarioPlaying=uid;
  btn.textContent='⏹ 停止';
  btn.classList.add('playing');
  let i=0;
  function next(){
    document.querySelectorAll('.sc-line.active').forEach(el=>el.classList.remove('active'));
    if(i>=scen.lines.length || scenarioPlaying!==uid){ resetScenarioBtn(uid); return; }
    const lineEl=document.getElementById('scl_'+uid+'_'+i);
    if(lineEl) lineEl.classList.add('active');
    const u=new SpeechSynthesisUtterance(stripTags(scen.lines[i].en));
    u.lang='en-US'; u.rate=currentRate; u.pitch=1.05;
    if(currentVoice) u.voice=currentVoice;
    u.onend=u.onerror=()=>{ i++; next(); };
    window.speechSynthesis.speak(u);
  }
  next();
}
function resetScenarioBtn(uid){
  const btn=document.getElementById('pa_'+uid);
  if(btn){ btn.textContent='▶ 整段播放'; btn.classList.remove('playing'); }
  document.querySelectorAll('.sc-line.active').forEach(el=>el.classList.remove('active'));
  if(scenarioPlaying===uid) scenarioPlaying=null;
}
function setRate(r,btn){currentRate=r;document.querySelectorAll('.rate-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');}
function toggleVoiceList(){document.getElementById('voiceList').classList.toggle('open');}
function buildVoiceList(){document.getElementById('voiceList').innerHTML=allVoices.map((v,i)=>`<div class="voice-item ${currentVoice&&currentVoice.name===v.name?'selected':''}" onclick="selectVoice(${i})"><div class="voice-dot"></div><div class="voice-item-name">${v.name}</div><div class="voice-item-lang">${v.lang}</div></div>`).join('');}
function selectVoice(i){currentVoice=allVoices[i];document.getElementById('voiceName').textContent='🎙️ '+currentVoice.name;buildVoiceList();document.getElementById('voiceList').classList.remove('open');const u=new SpeechSynthesisUtterance("Let's learn new words together!");u.lang='en-US';u.rate=currentRate;u.voice=currentVoice;window.speechSynthesis.cancel();window.speechSynthesis.speak(u);}
function loadVoices(){const raw=window.speechSynthesis.getVoices();const en=raw.filter(v=>v.lang.startsWith('en'));if(!en.length)return;allVoices=en;const prefer=['Samantha','Zira','Jenny','Aria','Emma','Karen','Moira','Fiona','Nicky'];let p=null;for(const n of prefer){p=en.find(v=>v.name.includes(n));if(p)break;}if(!p)p=en.find(v=>v.lang==='en-US')||en[0];currentVoice=p;document.getElementById('voiceName').textContent='🎙️ '+p.name;buildVoiceList();}

/* ---------- Quiz ---------- */
let QUIZ=[], quizAnswered=0, quizCorrect=0;

function buildQuizPool(){
  const starWords=[];
  UNITS.forEach(u=>u.words.forEach(w=>{ if(w.star) starWords.push(w); }));
  return starWords;
}
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function makeQuiz(n){
  const pool=shuffle(buildQuizPool()).slice(0,n);
  QUIZ = pool.map(w=>{
    const wrong = shuffle(buildQuizPool().filter(x=>x.c!==w.c)).slice(0,2).map(x=>x.c);
    const opts = shuffle([w.c, ...wrong]);
    return { q: w.w, ph: w.p, correct: w.c, opts };
  });
}

function buildQuiz(){
  makeQuiz(15);
  quizAnswered=0; quizCorrect=0;
  document.getElementById('quizCount').textContent = '共 '+QUIZ.length+' 题';
  document.getElementById('quizScore').textContent='';
  const root=document.getElementById('quizRoot');
  root.innerHTML = QUIZ.map((item,i)=>`
    <div class="mc-card">
      <div class="mc-q"><span class="qn">Q${i+1}.</span>${esc(item.q)} <span style="color:#94a3b8;font-weight:400;">${esc(item.ph)}</span> 是什么意思？</div>
      <div class="mc-opts">
        ${item.opts.map(o=>`<button class="mc-opt" onclick="answerQuiz(${i},this,'${esc(o).replace(/'/g,"\\'")}')">${esc(o)}</button>`).join('')}
      </div>
    </div>`).join('');
}

function answerQuiz(i,btn,chosen){
  const item=QUIZ[i];
  const group=btn.parentElement;
  if(group.dataset.done) return;
  group.dataset.done='1';
  quizAnswered++;
  const ok = chosen===item.correct;
  if(ok) quizCorrect++;
  [...group.children].forEach(b=>{
    b.classList.add('disabled');
    if(b.textContent===item.correct) b.classList.add('correct');
    else if(b===btn && !ok) b.classList.add('wrong');
  });
  if(quizAnswered===QUIZ.length){
    document.getElementById('quizScore').textContent = `🎉 完成！得分 ${quizCorrect} / ${QUIZ.length}`;
  }
}

function resetQuiz(){ buildQuiz(); }

buildGroups();
buildQuiz();
if(window.speechSynthesis){window.speechSynthesis.addEventListener('voiceschanged',loadVoices);loadVoices();}
else document.getElementById('voiceName').textContent='⚠️ 浏览器不支持语音';
</script>
